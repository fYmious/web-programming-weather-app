<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <title>Weather App</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- html is parsed before js executes -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <form>
      <label for="cities">Add city:</label><br />

      <input
        type="text"
        id="cities"
        name="city"
        autocomplete="off"
        placeholder="Start typing out city name"
      />

      <br />
      <br />
      <input id="submit-city" type="button" value="Add" />
    </form>

    <div id="forecast"></div>
  </body>
</html>
